<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>__TITLE__</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); padding: 20px 24px; border-bottom: 1px solid #475569; }
    .header h1 { font-size: 18px; font-weight: 600; word-break: break-all; }
    .header .meta { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
    .card { background: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; margin-bottom: 16px; }
    .card-header { padding: 14px 16px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .card-header h2 { font-size: 14px; font-weight: 600; color: #94a3b8; }
    .file-list { list-style: none; }
    .file-list li { padding: 10px 16px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
    .file-list li:last-child { border-bottom: none; }
    .file-icon { width: 36px; height: 36px; border-radius: 8px; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .file-icon.img { background: #065f46; }
    .file-icon.txt { background: #1e3a5f; }
    .file-icon.zip { background: #7c2d12; }
    .file-icon.doc { background: #4c1d95; }
    .file-info { flex: 1; min-width: 0; }
    .file-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-size { font-size: 11px; color: #64748b; }
    .file-actions { display: flex; gap: 6px; }
    .btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-secondary:hover { background: #475569; }
    .preview { padding: 16px; text-align: center; }
    .preview img { max-width: 100%; max-height: 60vh; border-radius: 8px; }
    .preview pre { text-align: left; background: #0f172a; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 12px; line-height: 1.6; max-height: 60vh; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
    .preview .placeholder { padding: 40px; color: #64748b; }
    .preview .placeholder .icon { font-size: 48px; margin-bottom: 12px; }
    .download-all { display: flex; justify-content: center; padding: 16px; }
    .empty { text-align: center; padding: 40px; color: #64748b; }
    @media (max-width: 600px) {
      .file-list li { flex-wrap: wrap; }
      .file-actions { width: 100%; justify-content: flex-end; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📦 __TITLE__</h1>
    <div class="meta">__META__</div>
  </div>
  <div class="container">
    __CONTENT__
  </div>
  <script>
    function downloadFile(url, name) {
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  </script>
</body>
</html>
