user nginx;

events {
    worker_connections 1024;
}

http {
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/json                      json;
        image/png                             png;
        image/svg+xml                         svg svgz;
        font/woff                             woff;
        font/woff2                            woff2;
        application/octet-stream              bin exe dll;
        application/pdf                       pdf;
        application/zip                       zip;
        application/gzip                      gz;
        audio/mpeg                            mp3;
        video/mp4                             mp4;
        text/plain                            txt;
    }
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=deploy:10m rate=2r/s;

    upstream pages_mcp {
        server 127.0.0.1:38300;
        keepalive 32;
    }

    # Deploy: sed -i 's/__SERVER_NAME__/your.domain.com/g' nginx.conf
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name __SERVER_NAME__;

        ssl_certificate /cert/__SERVER_NAME___ecc/fullchain.cer;
        ssl_certificate_key /cert/__SERVER_NAME___ecc/__SERVER_NAME__.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Strip server CSP so app-layer CSP takes effect
        proxy_hide_header Content-Security-Policy;

        # ─── Admin Dashboard ────────────────────────────────
        location / {
            limit_req zone=admin burst=10 nodelay;
            proxy_pass http://pages_mcp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ─── REST API ──────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://pages_mcp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ─── Deploy API (larger body limit) ────────────────
        location /api/deploy {
            limit_req zone=deploy burst=5 nodelay;
            proxy_pass http://pages_mcp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            client_max_body_size 1000m;
        }

        # ─── MCP JSON-RPC Endpoint ────────────────────────
        location /mcp {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://pages_mcp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ─── Static Pages (/s/:shareId) ──────────────────
        location /s/ {
            proxy_pass http://pages_mcp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Cache static assets
            location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                proxy_pass http://pages_mcp;
                proxy_set_header Host $host;
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }

        # ─── File Shares (/f/:shareId) ───────────────────
        location /f/ {
            proxy_pass http://pages_mcp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            client_max_body_size 1000m;
        }

        # ─── Health Check ──────────────────────────────────
        location /health {
            proxy_pass http://pages_mcp;
            proxy_set_header Host $host;
            access_log off;
        }

        # ─── Block dotfiles ────────────────────────────────
        location ~ /\. { deny all; return 404; }
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name __SERVER_NAME__;
        return 301 https://$host$request_uri;
    }

    # Default catch-all
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        ssl_certificate /cert/__SERVER_NAME___ecc/fullchain.cer;
        ssl_certificate_key /cert/__SERVER_NAME___ecc/__SERVER_NAME__.key;
        return 444;
    }
}
